<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Family Words Tracing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,700&family=Fredoka:wght@500;700&display=swap');

        body {
            font-family: 'Comic Neue', 'Chalkboard SE', 'Comic Sans MS', 'Fredoka', cursive, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #e0f2fe 0%, #fbcfe8 50%, #fef08a 100%);
        }

        .bubble-btn {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
            font-family: 'Comic Neue', 'Chalkboard SE', 'Comic Sans MS', sans-serif;
        }

        .bubble-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 4px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .smooth-scroll {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .smooth-scroll::-webkit-scrollbar { height: 6px; }
        .smooth-scroll::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.6);
            border-radius: 8px;
        }
        .smooth-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 8px;
        }

        @keyframes modalShake {
            0%, 100% { transform: translateX(0) scale(1); }
            20%, 60% { transform: translateX(-12px) scale(1.02); }
            40%, 80% { transform: translateX(12px) scale(1.02); }
        }

        .animate-shake { animation: modalShake 0.45s ease-in-out; }
    </style>
</head>

    <script>
        class SoundEffects {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            speakLetter(letter) {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(letter.length === 1 ? `Letter ${letter}` : letter);
                utterance.rate = 0.88;
                utterance.pitch = 1.1;
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }

            speakWord(word) {
                this.speakLetter(word);
            }

            playTone(freq, type = 'sine', duration = 0.08) {
                if (!this.enabled) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }

            playSuccess() {
                if (!this.enabled) return;
                [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'triangle', 0.25), idx * 100);
                });
            }

            playError() {
                if (!this.enabled) return;
                this.playTone(180, 'sawtooth', 0.22);
                setTimeout(() => this.playTone(130, 'sawtooth', 0.28), 120);
            }
        }

        const sound = new SoundEffects();

        function sampleCubicBezier(p0, p1, p2, p3, segments = 24) {
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const cx = 3 * (p1.x - p0.x);
                const bx = 3 * (p2.x - p1.x) - cx;
                const ax = p3.x - p0.x - cx - bx;
                const cy = 3 * (p1.y - p0.y);
                const by = 3 * (p2.y - p1.y) - cy;
                const ay = p3.y - p0.y - cy - by;
                points.push({
                    x: ax * Math.pow(t, 3) + bx * Math.pow(t, 2) + cx * t + p0.x,
                    y: ay * Math.pow(t, 3) + by * Math.pow(t, 2) + cy * t + p0.y
                });
            }
            return points;
        }

        function sampleArc(cx, cy, radius, startAngle, endAngle, segments = 24) {
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const angle = startAngle + (endAngle - startAngle) * (i / segments);
                points.push({
                    x: cx + radius * Math.cos(angle),
                    y: cy + radius * Math.sin(angle)
                });
            }
            return points;
        }

        // Canvas y-down: 0 = 3 o'clock, increasing = clockwise.
        function sampleCCW(cx, cy, r, startAng, sweep = Math.PI * 2, segments = 24) {
            return sampleArc(cx, cy, r, startAng, startAng - Math.abs(sweep), segments);
        }
        function sampleCW(cx, cy, r, startAng, sweep = Math.PI * 2, segments = 24) {
            return sampleArc(cx, cy, r, startAng, startAng + Math.abs(sweep), segments);
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            buildCheckpoints();
            render();
        }

        window.addEventListener('resize', resizeCanvas);

        function getCanvasPos(point) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (point.x / 100) * rect.width,
                y: (point.y / 100) * rect.height
            };
        }

        function downsampleStroke(stroke) {
            const maxPts = 8;
            if (stroke.length <= maxPts) return stroke;
            const out = [];
            for (let i = 0; i < maxPts; i++) {
                const idx = Math.round(i * (stroke.length - 1) / (maxPts - 1));
                out.push(stroke[idx]);
            }
            return out;
        }

        function buildCheckpoints() {
            const template = LETTER_TEMPLATES[currentLetter];
            if (!template) return;
            completedCheckpoints.clear();
            allCheckpointsList = [];

            template.strokes.forEach((stroke, strokeIdx) => {
                const pts = downsampleStroke(stroke);
                pts.forEach((pt, ptIdx) => {
                    const canvasPos = getCanvasPos(pt);
                    allCheckpointsList.push({
                        id: `${strokeIdx}-${ptIdx}`,
                        strokeIndex: strokeIdx,
                        pointIndex: ptIdx,
                        isStart: ptIdx === 0,
                        isEnd: ptIdx === pts.length - 1,
                        x: canvasPos.x,
                        y: canvasPos.y
                    });
                });
            });

            currentStrokeIndex = 0;
            updateStrokeCheckpoints();
        }

        function updateStrokeCheckpoints() {
            currentStrokeCheckpoints = allCheckpointsList.filter(cp => cp.strokeIndex === currentStrokeIndex);
        }

        function drawGuidelines() {
            const rect = canvas.getBoundingClientRect();
            const ys = [0.16, 0.40, 0.64, 0.88];
            ctx.save();
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1.5;
            ys.forEach((t, i) => {
                ctx.setLineDash(i === 1 ? [6, 6] : []);
                ctx.beginPath();
                ctx.moveTo(rect.width * 0.08, rect.height * t);
                ctx.lineTo(rect.width * 0.92, rect.height * t);
                ctx.stroke();
            });
            ctx.restore();
        }

        function drawTemplate() {
            const template = LETTER_TEMPLATES[currentLetter];
            if (!template) return;

            drawGuidelines();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            template.strokes.forEach((stroke, idx) => {
                const pos0 = getCanvasPos(stroke[0]);
                const isDot = stroke.length < 2;

                if (isDot) {
                    ctx.setLineDash([]);
                    ctx.beginPath();
                    ctx.fillStyle = idx < currentStrokeIndex ? '#bfdbfe' : (idx === currentStrokeIndex ? '#fef9c3' : '#f8fafc');
                    ctx.arc(pos0.x, pos0.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.strokeStyle = idx < currentStrokeIndex ? '#60a5fa' : (idx === currentStrokeIndex ? '#ca8a04' : '#94a3b8');
                    ctx.lineWidth = 2.5;
                    ctx.arc(pos0.x, pos0.y, 7, 0, Math.PI * 2);
                    ctx.stroke();
                    return;
                }

                ctx.beginPath();
                stroke.forEach((pt, pIdx) => {
                    const pos = getCanvasPos(pt);
                    if (pIdx === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                });

                if (idx < currentStrokeIndex) {
                    ctx.setLineDash([]);
                    ctx.strokeStyle = '#93c5fd';
                    ctx.lineWidth = strokeRadius * 1.6;
                    ctx.stroke();
                } else {
                    ctx.setLineDash([10, 12]);
                    ctx.strokeStyle = idx === currentStrokeIndex ? '#64748b' : '#cbd5e1';
                    ctx.lineWidth = strokeRadius * 1.35;
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            });

            const currentStroke = template.strokes[currentStrokeIndex];
            if (currentStroke && currentStroke.length > 1) {
                for (let i = 0; i < currentStroke.length - 1; i++) {
                    const p1 = getCanvasPos(currentStroke[i]);
                    const p2 = getCanvasPos(currentStroke[i + 1]);
                    drawDirectionArrows(p1, p2);
                }
            }

            template.strokes.forEach((stroke, idx) => {
                if (idx < currentStrokeIndex) return;
                const start = getCanvasPos(stroke[0]);
                const nxy = offsetNumber(start, stroke);
                drawStrokeNumber(nxy.x, nxy.y, idx + 1, idx === currentStrokeIndex);
            });

            allCheckpointsList.forEach(cp => {
                const done = completedCheckpoints.has(cp.id);
                const template = LETTER_TEMPLATES[currentLetter];
                const isDot = template.strokes[cp.strokeIndex] && template.strokes[cp.strokeIndex].length < 2;
                const r = isDot ? 7 : (cp.isStart ? 16 : 12);
                if (done) {
                    drawStarIcon(cp.x, cp.y, isDot ? 6 : 11, '#10b981', '#047857');
                } else if (cp.strokeIndex === currentStrokeIndex) {
                    drawStarIcon(cp.x, cp.y, r, '#fbbf24', '#d97706');
                } else if (cp.strokeIndex > currentStrokeIndex && cp.isStart) {
                    drawStarIcon(cp.x, cp.y, isDot ? 6 : 10, '#e2e8f0', '#94a3b8');
                }
            });
        }

        function offsetNumber(start, stroke) {
            if (!stroke || stroke.length < 2) return { x: start.x - 22, y: start.y - 22 };
            const n = getCanvasPos(stroke[Math.min(1, stroke.length - 1)]);
            const dx = start.x - n.x;
            const dy = start.y - n.y;
            const len = Math.hypot(dx, dy) || 1;
            return { x: start.x + (dx / len) * 26, y: start.y + (dy / len) * 26 };
        }

        function drawStarIcon(cx, cy, r, fill, stroke) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.beginPath();
            ctx.fillStyle = fill;
            ctx.strokeStyle = stroke || '#f59e0b';
            ctx.lineWidth = 2;
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r, -Math.sin((18 + i * 72) * Math.PI / 180) * r);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r / 2), -Math.sin((54 + i * 72) * Math.PI / 180) * (r / 2));
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function drawDirectionArrows(p1, p2) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 18) return;
            const angle = Math.atan2(dy, dx);
            ctx.save();
            ctx.fillStyle = '#3b82f6';
            for (let d = 22; d < dist - 12; d += 36) {
                const ax = p1.x + (dx / dist) * d;
                const ay = p1.y + (dy / dist) * d;
                ctx.save();
                ctx.translate(ax, ay);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-8, -6);
                ctx.lineTo(-5, 0);
                ctx.lineTo(-8, 6);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            ctx.restore();
        }

        function drawStrokeNumber(cx, cy, n, isCurrent) {
            const r = isCurrent ? 16 : 13;
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = isCurrent ? '#f59e0b' : '#94a3b8';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${isCurrent ? 16 : 13}px Comic Neue, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(n), cx, cy + 0.5);
            ctx.restore();
        }

        function drawUserStrokes() {
            if (userPoints.length < 2) return;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(37, 99, 235, 0.25)';
            ctx.shadowBlur = 8;
            for (let i = 1; i < userPoints.length; i++) {
                const pt1 = userPoints[i - 1];
                const pt2 = userPoints[i];
                if (pt2.isNewStroke) continue;
                ctx.beginPath();
                ctx.moveTo(pt1.x, pt1.y);
                ctx.lineTo(pt2.x, pt2.y);
                ctx.strokeStyle = '#2563eb';
                ctx.lineWidth = 16;
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        }

        function render() {
            const rect = canvas.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);
            if (!reviewMode) {
                drawTemplate();
            }
            drawUserStrokes();
        }

        function checkProgress(pos) {
            if (currentStrokeCheckpoints.length === 0) return;
            currentStrokeCheckpoints.forEach((targetCP, idx) => {
                if (completedCheckpoints.has(targetCP.id)) return;
                const dist = Math.hypot(pos.x - targetCP.x, pos.y - targetCP.y);
                if (dist <= hitRadius) {
                    if (idx === 0 || completedCheckpoints.has(currentStrokeCheckpoints[idx - 1].id)) {
                        completedCheckpoints.add(targetCP.id);
                        sound.playTone(400 + (completedCheckpoints.size * 35), 'sine', 0.08);
                        const strokeFinished = currentStrokeCheckpoints.every(cp => completedCheckpoints.has(cp.id));
                        if (strokeFinished) {
                            const template = LETTER_TEMPLATES[currentLetter];
                            if (currentStrokeIndex < template.strokes.length - 1) {
                                currentStrokeIndex++;
                                updateStrokeCheckpoints();
                            }
                        }
                    }
                }
            });
        }

        function evaluateTracingQuality() {
            const template = LETTER_TEMPLATES[currentLetter];
            if (!template || userPoints.length < 5) {
                return { isValid: false, reason: 'Please trace along the dotted letter!', accuracy: 0 };
            }

            const templatePoints = [];
            template.strokes.forEach(stroke => {
                if (stroke.length < 2) {
                    templatePoints.push(getCanvasPos(stroke[0]));
                    return;
                }
                for (let i = 0; i < stroke.length - 1; i++) {
                    const p1 = getCanvasPos(stroke[i]);
                    const p2 = getCanvasPos(stroke[i + 1]);
                    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                    const steps = Math.ceil(dist / 4);
                    for (let s = 0; s <= steps; s++) {
                        templatePoints.push({
                            x: p1.x + (p2.x - p1.x) * (s / steps),
                            y: p1.y + (p2.y - p1.y) * (s / steps)
                        });
                    }
                }
            });

            let outOfBoundCount = 0;
            const maxAllowedDistance = strokeRadius * 1.55;
            userPoints.forEach(uPt => {
                let minDist = Infinity;
                templatePoints.forEach(tPt => {
                    const d = Math.hypot(uPt.x - tPt.x, uPt.y - tPt.y);
                    if (d < minDist) minDist = d;
                });
                if (minDist > maxAllowedDistance) outOfBoundCount++;
            });

            const outOfBoundRatio = outOfBoundCount / userPoints.length;
            const coverageRadius = strokeRadius * 1.4;
            let coveredTemplateCount = 0;
            templatePoints.forEach(tPt => {
                if (userPoints.some(uPt => Math.hypot(uPt.x - tPt.x, uPt.y - tPt.y) <= coverageRadius)) {
                    coveredTemplateCount++;
                }
            });

            const coverageRatio = coveredTemplateCount / templatePoints.length;
            const accuracyScore = Math.round((1 - outOfBoundRatio) * coverageRatio * 100);

            if (outOfBoundRatio > FAIL_OUT_OF_BOUND) {
                return { isValid: false, reason: 'Stay on the dotted line!', accuracy: accuracyScore };
            }
            if (coverageRatio < PASS_COVERAGE) {
                return { isValid: false, reason: 'Trace the whole letter — follow 1, 2, 3!', accuracy: accuracyScore };
            }
            return { isValid: true, reason: '', accuracy: Math.min(100, Math.max(0, accuracyScore)) };
        }

        function isAllCheckpointsComplete() {
            return allCheckpointsList.length > 0 && allCheckpointsList.every(cp => completedCheckpoints.has(cp.id));
        }

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startTracing(e) {
            if (reviewMode) return;
            e.preventDefault();
            isDrawing = true;
            sound.init();
            const pos = getEventPos(e);
            userPoints.push({ x: pos.x, y: pos.y, isNewStroke: true });
            checkProgress(pos);
            document.getElementById('score-display').innerText = 'Tracing...';
            document.getElementById('score-display').className = 'text-base sm:text-2xl font-black text-amber-500';
            render();
        }

        function moveTracing(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getEventPos(e);
            userPoints.push({ x: pos.x, y: pos.y, isNewStroke: false });
            checkProgress(pos);
            render();
        }

        function stopTracing() {
            if (!isDrawing) return;
            isDrawing = false;
            if (isAllCheckpointsComplete()) {
                const result = evaluateTracingQuality();
                if (result.isValid && result.accuracy >= PASS_ACCURACY) {
                    document.getElementById('score-display').innerText = `${result.accuracy}%`;
                    document.getElementById('score-display').className = 'text-base sm:text-2xl font-black text-emerald-600';
                    triggerSuccess(result.accuracy);
                } else {
                    document.getElementById('score-display').innerText = 'Try Again';
                    document.getElementById('score-display').className = 'text-base sm:text-2xl font-black text-rose-500';
                    triggerTryAgain(result.reason);
                }
            } else {
                const template = LETTER_TEMPLATES[currentLetter];
                document.getElementById('score-display').innerText = `Stroke ${currentStrokeIndex + 1}/${template.strokes.length}`;
                document.getElementById('score-display').className = 'text-base sm:text-2xl font-black text-indigo-600';
            }
        }

        function triggerSuccess(score) {
            reviewMode = true;
            render();
            sound.playSuccess();
            document.getElementById('modal-score').innerText = `${score}%`;
            document.getElementById('review-bar').classList.remove('hidden');
            if (typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            }
        }

        function triggerTryAgain(reasonMsg) {
            sound.playError();
            document.getElementById('try-again-reason').innerText = reasonMsg || 'Follow 1, 2, 3 and stay on the dots!';
            const modal = document.getElementById('try-again-modal');
            const box = document.getElementById('try-again-box');
            modal.classList.remove('hidden');
            box.classList.remove('animate-shake');
            void box.offsetWidth;
            box.classList.add('animate-shake');
        }

        function currentWord() {
            return WORDS[wordIndex];
        }

        function updateWordUI() {
            const w = currentWord();
            document.getElementById('word-emoji').textContent = w.emoji;
            document.getElementById('emoji-badge').textContent = w.emoji;
            document.getElementById('word-preview').textContent = w.word;
            document.getElementById('letter-hint').textContent = `Trace: ${currentLetter}`;
            document.getElementById('word-letters').innerHTML = [...w.word].map((ch, i) => {
                if (i < letterIndex) return `<span class="text-emerald-500">${ch}</span>`;
                if (i === letterIndex) return `<span class="text-indigo-600 underline">${ch}</span>`;
                return `<span class="text-slate-400">${ch}</span>`;
            }).join('');
        }

        function loadCurrentGlyph() {
            currentLetter = currentWord().word[letterIndex];
            resetCanvas();
            initWordSelector();
            updateWordUI();
            sound.speakLetter(currentLetter);
        }

        function initWordSelector() {
            const selectorContainer = document.getElementById('letter-selector');
            selectorContainer.innerHTML = '';
            WORDS.forEach((w, i) => {
                const btn = document.createElement('button');
                btn.id = `word-btn-${i}`;
                const isActive = i === wordIndex;
                btn.className = `bubble-btn h-12 px-3 rounded-2xl text-lg font-black flex items-center justify-center gap-1 shrink-0 ${
                    isActive
                        ? 'bg-indigo-600 text-white shadow-lg scale-105 border-2 border-indigo-400'
                        : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                }`;
                btn.innerHTML = `<span class="text-xl">${w.emoji}</span><span class="hidden sm:inline">${w.word}</span>`;
                btn.onclick = () => {
                    wordIndex = i;
                    letterIndex = 0;
                    loadCurrentGlyph();
                    sound.speakWord(w.word);
                };
                selectorContainer.appendChild(btn);
            });
            setTimeout(() => {
                const activeBtn = document.getElementById(`word-btn-${wordIndex}`);
                if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }, 50);
        }

        function resetCanvas() {
            reviewMode = false;
            userPoints = [];
            completedCheckpoints.clear();
            currentStrokeIndex = 0;
            document.getElementById('score-display').innerText = 'Ready';
            document.getElementById('score-display').className = 'text-base sm:text-2xl font-black text-indigo-600';
            document.getElementById('review-bar').classList.add('hidden');
            document.getElementById('try-again-modal').classList.add('hidden');
            buildCheckpoints();
            render();
        }

        function navigateLetter(delta) {
            const len = currentWord().word.length;
            if (delta > 0) {
                if (letterIndex < len - 1) {
                    letterIndex++;
                    loadCurrentGlyph();
                } else if (wordIndex < WORDS.length - 1) {
                    wordIndex++;
                    letterIndex = 0;
                    loadCurrentGlyph();
                    sound.speakWord(currentWord().word);
                } else {
                    wordIndex = 0;
                    letterIndex = 0;
                    loadCurrentGlyph();
                }
            } else {
                if (letterIndex > 0) {
                    letterIndex--;
                    loadCurrentGlyph();
                } else if (wordIndex > 0) {
                    wordIndex--;
                    letterIndex = WORDS[wordIndex].word.length - 1;
                    loadCurrentGlyph();
                }
            }
        }

        canvas.addEventListener('mousedown', startTracing);
        canvas.addEventListener('mousemove', moveTracing);
        canvas.addEventListener('mouseup', stopTracing);
        canvas.addEventListener('mouseleave', stopTracing);
        canvas.addEventListener('touchstart', startTracing, { passive: false });
        canvas.addEventListener('touchmove', moveTracing, { passive: false });
        canvas.addEventListener('touchend', stopTracing);

        document.getElementById('reset-btn').addEventListener('click', resetCanvas);
        document.getElementById('prev-letter-btn').addEventListener('click', () => navigateLetter(-1));
        document.getElementById('next-letter-btn').addEventListener('click', () => navigateLetter(1));
        document.getElementById('next-btn').addEventListener('click', () => navigateLetter(1));
        document.getElementById('retry-btn').addEventListener('click', resetCanvas);
        document.getElementById('speaker-btn').addEventListener('click', () => sound.speakLetter(currentLetter));
        document.getElementById('letter-title-box').addEventListener('click', () => sound.speakWord(currentWord().word));

        const letterBar = document.getElementById('letter-selector');
        document.getElementById('scroll-left-btn').addEventListener('click', () => {
            letterBar.scrollBy({ left: -220, behavior: 'smooth' });
        });
        document.getElementById('scroll-right-btn').addEventListener('click', () => {
            letterBar.scrollBy({ left: 220, behavior: 'smooth' });
        });

        document.getElementById('sound-toggle').addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            document.getElementById('sound-icon').className = sound.enabled ? 'fa-solid fa-music' : 'fa-solid fa-volume-xmark';
        });

        window.onload = () => {
            initWordSelector();
            updateWordUI();
            setTimeout(() => {
                resizeCanvas();
                sound.speakWord(currentWord().word);
            }, 100);
        };
    </script>
</body>
</html>
